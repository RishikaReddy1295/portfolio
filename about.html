<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Learn more about me, my skills, and my interests.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - About</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="#main-content" class="skip-link">Skip to Main Content</a>

<header>
    <h1>About Me</h1>

    <nav aria-label="Main Navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html" aria-current="page">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <button id="themeBtn">🌙 Dark Mode</button>
</header>

<main id="main-content">

    <section>
        <h2>Who I Am</h2>
        <p>I am a student learning web development, accessibility, and modern web technologies.</p>
    </section>

    <section>
        <h2>Skills</h2>
        <ul>
            <li>HTML5</li>
            <li>CSS3</li>
            <li>JavaScript</li>
            <li>Web Accessibility</li>
        </ul>
    </section>

</main>

<footer>
    <p>&copy; 2026 My Portfolio</p>
</footer>

<script>
const themeBtn = document.getElementById("themeBtn");

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
}

themeBtn.addEventListener("click", function() {
    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
});
</script>

</body>
</html>
