<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="description"
    content="JavaScript Task Manager with CRUD operations, filters, and localStorage support."
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>My Portfolio - Task Manager</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>

<a href="#main-content" class="skip-link">
  Skip to Main Content
</a>

<header>

  <h1>Task Manager</h1>

  <nav aria-label="Main Navigation">
    <ul>

      <li><a href="index.html">Home</a></li>

      <li><a href="about.html">About</a></li>

      <li><a href="contact.html">Contact</a></li>

      <li>
        <a href="todo.html" aria-current="page">
          Task Manager
        </a>
      </li>
      <li><a href="weather.html">Weather</a></li>

    </ul>
  </nav>

  <button id="themeBtn">🌙 Dark Mode</button>

</header>

<main id="main-content">

  <section class="todo-container">

    <h2>Manage Your Tasks</h2>

    <p>
      A responsive JavaScript To-Do application
      with CRUD operations and localStorage support.
    </p>

    <div class="input-section">

      <input
        type="text"
        id="taskInput"
        placeholder="Enter a task"
        aria-label="Task Input"
      >

      <button id="addBtn">
        Add
      </button>

    </div>

    <div class="filter-buttons">

      <button onclick="filterTasks('all')">
        All
      </button>

      <button onclick="filterTasks('active')">
        Active
      </button>

      <button onclick="filterTasks('completed')">
        Completed
      </button>

    </div>

    <ul id="taskList"></ul>

  </section>

</main>

<footer>
  <p>&copy; 2026 My Portfolio</p>
</footer>

<script>

const themeBtn = document.getElementById("themeBtn");

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
}

themeBtn.addEventListener("click", function () {

    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }

});

</script>

<script src="js/todo.js"></script>

</body>
</html>
